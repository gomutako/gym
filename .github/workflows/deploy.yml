name: Deploy

# Deploy automatico su push a main (o avvio manuale).
#
# Secrets richiesti (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST    IP pubblico o dominio dell'EC2
#   DEPLOY_USER    utente SSH proprietario di /opt/gym (es. "gym")
#   DEPLOY_SSH_KEY chiave privata SSH (la cui pubblica è in authorized_keys dell'utente)
#   DEPLOY_PORT    (opzionale) porta SSH, default 22

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 1) Gate: la build deve passare prima di rilasciare
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build --workspace frontend

  # 2) Deploy: SSH sul server ed esegue lo script
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd /opt/gym
            ./deploy/deploy.sh
