<!-- Template email di cambio indirizzo (italiano).
     Inviata quando un utente cambia la propria email (conferma richiesta).
     Produzione: incollare nel dashboard (Authentication → Email Templates → Change email address).
     Variabili: {{ .ConfirmationURL }} {{ .Email }} (attuale) {{ .NewEmail }} (nuova) -->
<div style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #111827;">
  <h1 style="font-size: 20px; margin: 0 0 8px;">Conferma il cambio email</h1>
  <p style="font-size: 14px; color: #4b5563; line-height: 1.5;">
    Hai richiesto di cambiare l'email del tuo account da
    <strong>{{ .Email }}</strong> a <strong>{{ .NewEmail }}</strong>.
    Conferma per applicare la modifica.
  </p>
  <p style="text-align: center; margin: 24px 0;">
    <a href="{{ .ConfirmationURL }}"
       style="display: inline-block; background: #4f46e5; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 14px; padding: 12px 24px; border-radius: 12px;">
      Conferma cambio email
    </a>
  </p>
  <p style="font-size: 12px; color: #9ca3af; line-height: 1.5;">
    Se non hai richiesto tu questa modifica, ignora questa email: l'indirizzo resta invariato.
  </p>
</div>
