<!-- Template email di conferma registrazione (italiano).
     Usato solo se attivi "Confirm email" in Authentication (di default è disattivo).
     Produzione: incollare nel dashboard (Authentication → Email Templates → Confirm signup).
     Variabili: {{ .ConfirmationURL }} {{ .SiteURL }} {{ .Email }} -->
<div style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #111827;">
  <h1 style="font-size: 20px; margin: 0 0 8px;">Conferma la tua email</h1>
  <p style="font-size: 14px; color: #4b5563; line-height: 1.5;">
    Benvenuto in <strong>Gym Manager</strong>! Conferma l'indirizzo
    <strong>{{ .Email }}</strong> per attivare il tuo account.
  </p>
  <p style="text-align: center; margin: 24px 0;">
    <a href="{{ .ConfirmationURL }}"
       style="display: inline-block; background: #A45668; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 14px; padding: 12px 24px; border-radius: 12px;">
      Conferma email
    </a>
  </p>
  <p style="font-size: 12px; color: #9ca3af; line-height: 1.5;">
    Se non hai creato tu questo account, ignora questa email.
  </p>
</div>
