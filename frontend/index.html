<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: gestisce le safe-area sui device con notch.
         maximum-scale/user-scalable: iOS zooma sul campo al focus quando il font è
         sotto i 16px, e la maggior parte dei campi usa text-sm (14px). Bloccare la
         scala evita il salto senza ingrandire i form ovunque. Nota: Safari mobile
         ignora user-scalable dal 2016 (accessibilità) e lì lo zoom resta; la
         WKWebView dell'app — dove il problema si vedeva — lo rispetta. È anche il
         default del template Capacitor. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Deve combaciare con brand[600] di src/lib/palette.js (rosa antico).
         Qui è per forza un valore fisso: index.html non passa dal bundler. -->
    <meta name="theme-color" content="#A45668" />
    <!-- Supporto "Aggiungi a Home" su iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gym" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Pallade</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Applica il tema salvato PRIMA del render per evitare il flash chiaro -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('theme') || 'auto';
          var dark = m === 'dark' ||
            (m === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
